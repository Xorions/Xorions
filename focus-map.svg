<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Focus architecture map: AI and Machine Learning, Trading Bot and Signal Automation, OSINT and Cybersecurity, Full-Stack Web">
  <title>XORIONS - Focus Architecture</title>

  <defs>
    <linearGradient id="fmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="55%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <linearGradient id="fmTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="fmRail" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="740" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#00d4ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="fmGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#16213e" stroke-width="1" opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#00d4ff" opacity="0.15"/>
    </pattern>

    <filter id="fmGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="fmClip">
      <rect x="0" y="0" width="800" height="420" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .h { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .b { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .m { font-family: Consolas, 'Courier New', monospace; }
  </style>

  <g clip-path="url(#fmClip)">
    <rect width="800" height="420" fill="url(#fmBg)"/>
    <rect x="-40" y="-40" width="880" height="500" fill="url(#fmGrid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- header -->
    <text class="h" x="400" y="46" font-size="20" fill="url(#fmTitle)" letter-spacing="4" text-anchor="middle">FOCUS ARCHITECTURE</text>
    <text class="m" x="400" y="68" font-size="9.5" fill="#6b7f9e" letter-spacing="2.2" text-anchor="middle">XORIONS // CORE DOMAINS // 2026</text>
    <line x1="60" y1="84" x2="740" y2="84" stroke="url(#fmRail)" stroke-width="1.6"/>

    <!-- corner brackets -->
    <g fill="none" stroke="#233450" stroke-width="1.5" stroke-linecap="round">
      <path d="M 18 32 V 18 H 32"/>
      <path d="M 768 18 H 782 V 32"/>
      <path d="M 18 388 V 402 H 32"/>
      <path d="M 768 402 H 782 V 388"/>
    </g>

    <!-- glow behind hub -->
    <circle cx="400" cy="222" r="120" fill="url(#hubGlow)"/>

    <!-- connectors -->
    <g fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.9">
      <path d="M 270 148 L 353 195"/>
      <path d="M 530 148 L 447 195"/>
      <path d="M 270 336 L 359 258"/>
      <path d="M 530 336 L 441 258"/>
      <animate attributeName="stroke-dashoffset" values="0;-44" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- travelling packets -->
    <g fill="#eaf6ff" filter="url(#fmGlow)">
      <circle r="2.6">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M 270 148 L 353 195"/>
      </circle>
      <circle r="2.6">
        <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M 530 148 L 447 195"/>
      </circle>
      <circle r="2.6">
        <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M 270 336 L 359 258"/>
      </circle>
      <circle r="2.6">
        <animateMotion dur="3.2s" begin="2.4s" repeatCount="indefinite" path="M 530 336 L 441 258"/>
      </circle>
    </g>

    <!-- hub -->
    <g>
      <circle cx="400" cy="222" r="78" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="56;80" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="222" r="78" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="56;80" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="222" r="54" fill="#0a1626" stroke="#1e3a5f" stroke-width="1.4"/>
      <circle cx="400" cy="222" r="46" fill="none" stroke="#12324d" stroke-width="1"/>
      <text class="h" x="400" y="218" font-size="13" fill="#00d4ff" letter-spacing="1.6" text-anchor="middle">XORIONS</text>
      <text class="m" x="400" y="234" font-size="8" fill="#6b7f9e" letter-spacing="1.8" text-anchor="middle">FOCUS CORE</text>
    </g>

    <!-- card A : AI -->
    <g>
      <rect x="40" y="104" width="230" height="88" rx="10" fill="#0b1322" stroke="#1b2b45" stroke-width="1"/>
      <rect x="40" y="104" width="4" height="88" rx="2" fill="#00d4ff"/>
      <rect x="60" y="118" width="14" height="14" rx="2" fill="none" stroke="#00d4ff" stroke-width="1.6" transform="rotate(45 67 125)"/>
      <text class="b" x="86" y="130" font-size="13" fill="#e6f0ff" letter-spacing="0.8">AI &amp; MACHINE LEARNING</text>
      <text class="m" x="60" y="154" font-size="9" fill="#8fa3c0">Neural tools &#8226; Automation &#8226; ARTEXs</text>
      <text class="m" x="60" y="176" font-size="8" fill="#00d4ff" letter-spacing="0.6">#python #llm #agents</text>
    </g>

    <!-- card B : trading -->
    <g>
      <rect x="530" y="104" width="230" height="88" rx="10" fill="#0b1322" stroke="#1b2b45" stroke-width="1"/>
      <rect x="530" y="104" width="4" height="88" rx="2" fill="#a855f7"/>
      <path d="M 556 132 L 562 120 L 568 128 L 574 116" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="b" x="586" y="130" font-size="13" fill="#e6f0ff" letter-spacing="0.8">TRADING BOT &amp; SIGNALS</text>
      <text class="m" x="550" y="154" font-size="9" fill="#8fa3c0">BOT-Sinyal &#8226; 24/7 scan &#8226; Charts</text>
      <text class="m" x="550" y="176" font-size="8" fill="#a855f7" letter-spacing="0.6">#python #automation</text>
    </g>

    <!-- card C : OSINT -->
    <g>
      <rect x="40" y="292" width="230" height="88" rx="10" fill="#0b1322" stroke="#1b2b45" stroke-width="1"/>
      <rect x="40" y="292" width="4" height="88" rx="2" fill="#f59e0b"/>
      <circle cx="67" cy="313" r="6" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
      <circle cx="67" cy="313" r="2" fill="#f59e0b"/>
      <text class="b" x="86" y="318" font-size="11.8" letter-spacing="0.4" fill="#e6f0ff">OSINT &amp; CYBERSECURITY</text>
      <text class="m" x="60" y="342" font-size="9" fill="#8fa3c0">robin &#8226; Dark web &#8226; Pentest</text>
      <text class="m" x="60" y="364" font-size="8" fill="#f59e0b" letter-spacing="0.6">#osint #security</text>
    </g>

    <!-- card D : full-stack -->
    <g>
      <rect x="530" y="292" width="230" height="88" rx="10" fill="#0b1322" stroke="#1b2b45" stroke-width="1"/>
      <rect x="530" y="292" width="4" height="88" rx="2" fill="#10b981"/>
      <path d="M 556 306 h 18 v 14 h -18 z" fill="none" stroke="#10b981" stroke-width="1.6"/>
      <path d="M 560 320 v 4 h 10 v -4" fill="none" stroke="#10b981" stroke-width="1.4"/>
      <text class="b" x="586" y="318" font-size="13" fill="#e6f0ff" letter-spacing="0.8">FULL-STACK WEB</text>
      <text class="m" x="550" y="342" font-size="9" fill="#8fa3c0">Posyandu &#8226; Laravel &#8226; React</text>
      <text class="m" x="550" y="364" font-size="8" fill="#10b981" letter-spacing="0.6">#php #typescript</text>
    </g>

    <!-- footer -->
    <text class="m" x="400" y="404" font-size="8.5" fill="#55627a" letter-spacing="1.4" text-anchor="middle">4 CORE DOMAINS // CONTINUOUSLY BUILDING // github.com/Xorions</text>
  </g>

  <rect x="0.5" y="0.5" width="799" height="419" rx="18" fill="none" stroke="#1b2740" stroke-width="1"/>
</svg>
