<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Xorions - AI, Algorithmic Trading, Cybersecurity and OSINT">
  <title>XORIONS - AI / Algorithmic Trading / Cybersecurity &amp; OSINT</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="55%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="45%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#5b86e5"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00d4ff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.07"/>
    </linearGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#16213e" stroke-width="1" opacity="0.55"/>
      <circle cx="0" cy="0" r="1" fill="#00d4ff" opacity="0.18"/>
    </pattern>

    <filter id="glow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="280" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .mono  { font-family: Consolas, 'Courier New', monospace; }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- base -->
    <rect width="900" height="280" fill="url(#bgGrad)"/>
    <rect width="900" height="280" fill="url(#radarGlow)"/>

    <!-- animated cyber grid -->
    <rect x="-40" y="-40" width="980" height="360" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- slow scanline -->
    <rect x="0" y="-70" width="900" height="70" fill="url(#scanGrad)">
      <animate attributeName="y" values="-70;280" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- top / bottom frame lines -->
    <rect x="0" y="0" width="900" height="1" fill="#16213e"/>
    <rect x="0" y="279" width="900" height="1" fill="#16213e"/>
    <rect x="-240" y="0" width="240" height="2" fill="url(#beamGrad)">
      <animateTransform attributeName="transform" type="translate" values="-240 0;900 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="900" y="278" width="240" height="2" fill="url(#beamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-1140 0" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g fill="none" stroke="#233450" stroke-width="1.5" stroke-linecap="round">
      <path d="M 20 34 V 20 H 34"/>
      <path d="M 866 20 H 880 V 34"/>
      <path d="M 20 246 V 260 H 34"/>
      <path d="M 866 260 H 880 V 246"/>
    </g>

    <!-- status pill -->
    <g>
      <rect x="40" y="34" width="204" height="26" rx="13" fill="#0b1020" stroke="#1b2740" stroke-width="1"/>
      <circle cx="56" cy="47" r="3.6" fill="#22d3a7">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text class="mono" x="68" y="50.5" font-size="9.5" fill="#8fa3c0" letter-spacing="1.2">SYSTEM ONLINE // NODE 01</text>
    </g>

    <!-- id pill -->
    <g>
      <rect x="640" y="34" width="220" height="26" rx="13" fill="#0b1020" stroke="#1b2740" stroke-width="1"/>
      <text class="mono" x="656" y="50.5" font-size="9.5" fill="#7fd8ff" letter-spacing="1.2">ID: XORIONS // 2026</text>
    </g>

    <!-- radar -->
    <g>
      <circle cx="742" cy="140" r="96" fill="url(#radarGlow)"/>
      <g fill="none" stroke="#16324a" stroke-width="1" opacity="0.75">
        <circle cx="742" cy="140" r="28"/>
        <circle cx="742" cy="140" r="52"/>
        <circle cx="742" cy="140" r="76"/>
        <circle cx="742" cy="140" r="96"/>
        <line x1="646" y1="140" x2="838" y2="140"/>
        <line x1="742" y1="44" x2="742" y2="236"/>
      </g>

      <circle cx="742" cy="140" r="96" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5">
        <animate attributeName="r" values="30;96" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="742" cy="140" r="96" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5">
        <animate attributeName="r" values="30;96" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>

      <g>
        <path d="M 742 140 L 742 44 A 96 96 0 0 1 810 62 Z" fill="url(#sweepGrad)" opacity="0.8">
          <animateTransform attributeName="transform" type="rotate" from="0 742 140" to="360 742 140" dur="6s" repeatCount="indefinite"/>
        </path>
      </g>

      <circle cx="742" cy="140" r="4.5" fill="#00d4ff" filter="url(#softGlow)"/>

      <!-- network nodes -->
      <g fill="#00d4ff">
        <circle cx="660" cy="86" r="2.6">
          <animate attributeName="r" values="2.6;5;2.6" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="790" cy="76" r="2.4">
          <animate attributeName="r" values="2.4;4.6;2.4" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.45;1;0.45" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="826" cy="150" r="2.2">
          <animate attributeName="r" values="2.2;4.2;2.2" dur="2.7s" begin="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="784" cy="214" r="2.8">
          <animate attributeName="r" values="2.8;5.2;2.8" dur="2.3s" begin="0.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.45;1;0.45" dur="2.3s" begin="0.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="672" cy="200" r="2.4">
          <animate attributeName="r" values="2.4;4.6;2.4" dur="2.9s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- mesh links -->
      <g fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 6" opacity="0.8">
        <path d="M 660 86 L 742 140 L 790 76"/>
        <path d="M 742 140 L 826 150"/>
        <path d="M 742 140 L 784 214 L 672 200"/>
        <path d="M 672 200 L 742 140"/>
        <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.5s" repeatCount="indefinite"/>
      </g>

      <text class="mono" x="742" y="252" font-size="8.5" fill="#3d5a78" letter-spacing="2" text-anchor="middle">SIGNAL // RADAR</text>
    </g>

    <!-- title -->
    <text class="title" x="40" y="122" font-size="62" fill="url(#titleGrad)" letter-spacing="6" filter="url(#glow)">XORIONS</text>

    <!-- blinking terminal cursor -->
    <rect x="392" y="76" width="15" height="46" fill="#00d4ff" opacity="1">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- identity line -->
    <text class="mono" x="42" y="154" font-size="16.5" fill="#9fb3d1" letter-spacing="1.1">AI &#8226; Algorithmic Trading &#8226; Cybersecurity &amp; OSINT</text>

    <!-- divider -->
    <line x1="42" y1="172" x2="560" y2="172" stroke="#1b2740" stroke-width="1"/>
    <rect x="42" y="171" width="70" height="2" fill="#00d4ff" opacity="0.85">
      <animate attributeName="x" values="42;490;42" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- chips -->
    <g class="mono" font-size="9.5" letter-spacing="1.1">
      <g>
        <rect x="42" y="190" width="152" height="28" rx="8" fill="#0b1220" stroke="#1b2740" stroke-width="1"/>
        <circle cx="58" cy="204" r="3" fill="#00d4ff"/>
        <text x="70" y="207.5" fill="#cbd5e1">AI / MACHINE LEARNING</text>
      </g>
      <g>
        <rect x="204" y="190" width="98" height="28" rx="8" fill="#0b1220" stroke="#1b2740" stroke-width="1"/>
        <circle cx="220" cy="204" r="3" fill="#a855f7"/>
        <text x="232" y="207.5" fill="#cbd5e1">ALGO TRADING</text>
      </g>
      <g>
        <rect x="312" y="190" width="104" height="28" rx="8" fill="#0b1220" stroke="#1b2740" stroke-width="1"/>
        <circle cx="328" cy="204" r="3" fill="#f59e0b"/>
        <text x="340" y="207.5" fill="#cbd5e1">OSINT / CYBER</text>
      </g>
      <g>
        <rect x="426" y="190" width="110" height="28" rx="8" fill="#0b1220" stroke="#1b2740" stroke-width="1"/>
        <circle cx="442" cy="204" r="3" fill="#10b981"/>
        <text x="454" y="207.5" fill="#cbd5e1">FULL-STACK WEB</text>
      </g>
    </g>

    <!-- footer -->
    <text class="mono" x="42" y="252" font-size="9" fill="#55627a" letter-spacing="1">github.com/Xorions  //  signal &#8226; security &#8226; systems</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="279" rx="18" fill="none" stroke="#1b2740" stroke-width="1"/>
</svg>
